<!--
  Itzam Email Template
  --------------------
  Instructions for Claude:
  - Replace the {{BODY}} placeholder section with the email content.
  - Keep the header and footer intact.
  - Use inline styles only (do not add <style> blocks or external CSS) — many
    email clients strip them.
  - Do not change the image URLs.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Itzam</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f4f4f4;font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;">
    <!-- Outer wrapper -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f4f4;padding:32px 0;">
      <tr>
        <td align="center">

          <!-- Email container -->
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.05);">

            <!-- ============ HEADER / BANNER ============ -->
            <tr>
              <td align="center" style="background-color:#0a0a0a;padding:32px 24px;">
                <img
                  src="https://alquimia-felina-spaces-bucket.nyc3.cdn.digitaloceanspaces.com/itzam/logotype-darkmode-nobg.png"
                  alt="Itzam"
                  width="220"
                  style="display:block;border:0;outline:none;text-decoration:none;max-width:220px;height:auto;"
                />
              </td>
            </tr>

            <!-- Gold accent divider -->
            <tr>
              <td style="height:4px;background-color:#c9a14a;line-height:4px;font-size:4px;">&nbsp;</td>
            </tr>

            <!-- ============ BODY (Claude fills this in) ============ -->
            <tr>
              <td style="padding:40px 32px;font-size:16px;line-height:1.6;color:#1a1a1a;">

                <!-- ====================================================== -->
                <!-- {{BODY}}                                                -->
                <!-- Claude: insert greeting, paragraphs, CTAs here.         -->
                <!-- Example:                                                -->
                <!--   <p>Hi {{name}},</p>                                   -->
                <!--   <p>Thank you for reaching out...</p>                  -->
                <!--   <p><a href="https://itzam.ai" style="...">CTA</a></p> -->
                <!-- ====================================================== -->

                <p style="margin:0 0 16px 0;">Hi {{name}},</p>
                <p style="margin:0 0 16px 0;">[Email body goes here.]</p>
                <p style="margin:0 0 16px 0;">Best regards,<br/>The Itzam Team</p>

              </td>
            </tr>

            <!-- ============ FOOTER ============ -->
            <tr>
              <td style="background-color:#0a0a0a;padding:32px 24px;text-align:center;color:#cccccc;font-size:13px;line-height:1.6;">
                <img
                  src="https://alquimia-felina-spaces-bucket.nyc3.cdn.digitaloceanspaces.com/itzam/logo-gold-nobg.png"
                  alt="Itzam"
                  width="40"
                  style="display:block;margin:0 auto 12px auto;border:0;outline:none;text-decoration:none;height:auto;"
                />
                <div style="color:#c9a14a;font-weight:bold;font-size:14px;letter-spacing:1px;margin-bottom:8px;">ITZAM</div>
                <div style="margin-bottom:12px;">
                  <a href="https://itzam.ai" style="color:#ffffff;text-decoration:none;">itzam.ai</a>
                  &nbsp;&middot;&nbsp;
                  <a href="mailto:contact@itzam.ai" style="color:#ffffff;text-decoration:none;">contact@itzam.ai</a>
                </div>
                <div style="color:#888888;font-size:12px;">
                  &copy; 2026 Itzam. All rights reserved.
                </div>
              </td>
            </tr>

          </table>
          <!-- /Email container -->

        </td>
      </tr>
    </table>
  </body>
</html>
